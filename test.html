<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Moodify — API Key Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #333; }
    .status { margin: 16px 0; padding: 12px; border-radius: 4px; font-size: 14px; }
    .status.ok { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.loading { background: #d1ecf1; color: #0c5460; }
    button { padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 10px; }
    button:hover { background: #0056b3; }
    .result { margin-top: 16px; padding: 12px; background: #f9f9f9; border-left: 4px solid #ccc; border-radius: 4px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; font-size: 12px; }
    .hidden { display: none; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <div class="container">
    <h1>🔑 API Key Test</h1>
    <p>This page tests if your Anthropic API key is accessible from `.env.local`.</p>
    
    <div id="status" class="status loading">Loading config...</div>
    
    <button id="testBtn" class="hidden" onclick="testAPI()">Test Anthropic API</button>
    <button id="clearBtn" onclick="location.reload()">Clear & Reload</button>
    
    <div id="result" class="result hidden"></div>
  </div>

  <script>
    (async () => {
      try {
        const config = await window.loadConfig();
        const apiKey = config.ANTHROPIC_API_KEY;
        const status = document.getElementById('status');
        const testBtn = document.getElementById('testBtn');
        
        if (!apiKey) {
          status.className = 'status error';
          status.textContent = '❌ API key not found in .env.local. Create the file and add your key.';
          return;
        }
        
        if (apiKey === 'your-key-here') {
          status.className = 'status error';
          status.textContent = '❌ API key is still the placeholder value. Replace it with your actual Anthropic API key.';
          return;
        }
        
        status.className = 'status ok';
        status.textContent = `✅ API key loaded! Key starts with: ${apiKey.slice(0, 10)}...`;
        testBtn.classList.remove('hidden');
        
        // Store for test
        window.testApiKey = apiKey;
      } catch (err) {
        const status = document.getElementById('status');
        status.className = 'status error';
        status.textContent = `❌ Error loading config: ${err.message}`;
      }
    })();

    async function testAPI() {
      const result = document.getElementById('result');
      result.classList.remove('hidden');
      result.textContent = 'Testing API call...';
      
      try {
        const res = await fetch('https://api.anthropic.com/v1/complete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': window.testApiKey
          },
          body: JSON.stringify({
            model: 'claude-2',
            prompt: 'Say "Success!" in one word.',
            max_tokens: 10
          })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          result.textContent = `❌ API Error (${res.status}):\n${JSON.stringify(data, null, 2)}`;
          return;
        }
        
        result.textContent = `✅ API Call Successful!\n\nResponse:\n${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        result.textContent = `❌ Network Error:\n${err.message}`;
      }
    }
  </script>
</body>
</html>
